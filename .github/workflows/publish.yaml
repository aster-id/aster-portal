name: Publish docker image

# Main publishes dev images; Changesets releases publish version tags and latest.
on:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      tag_ref:
        description: 'Release tag passed from the release workflow'
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag_ref || github.ref }}
  cancel-in-progress: false

jobs:
  resolve-ref:
    name: Resolve immutable build commit
    if: github.repository == 'aster-id/aster-portal' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
      version: ${{ steps.ref.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Resolve source revision
        id: ref
        env:
          RELEASE_TAG: ${{ inputs.tag_ref }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo 'Expected a release tag in the form vMAJOR.MINOR.PATCH' >&2
              exit 1
            fi
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            sha=$(git --no-pager rev-parse "refs/tags/$RELEASE_TAG^{commit}")
            version=${RELEASE_TAG#v}
          else
            sha=$(git --no-pager rev-parse HEAD)
            version=''
          fi
          printf 'sha=%s\nversion=%s\n' "$sha" "$version" >> "$GITHUB_OUTPUT"

  checks:
    needs: [resolve-ref]
    uses: ./.github/workflows/checks.yaml
    with:
      ref: ${{ needs.resolve-ref.outputs.sha }}

  release:
    name: Publish docker image
    needs: [resolve-ref, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-ref.outputs.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the GitHub Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          context: git
          images: |
            ghcr.io/aster-id/aster-portal
          tags: |
            type=raw,value=sha-${{ needs.resolve-ref.outputs.sha }}
            type=semver,pattern={{version}},value=${{ needs.resolve-ref.outputs.version }},enable=${{ needs.resolve-ref.outputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.resolve-ref.outputs.version }},enable=${{ needs.resolve-ref.outputs.version != '' }}
            type=raw,value=latest,enable=${{ needs.resolve-ref.outputs.version != '' }}
            type=raw,value=dev,enable=${{ needs.resolve-ref.outputs.version == '' }}
          flavor: |
            latest=false

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          platforms: |
            linux/amd64
            linux/arm64
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
